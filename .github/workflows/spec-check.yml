name: spec-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Spec
        run: python tools/validate_spec.py

      - name: Verify Tag Format
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^spec-v[0-9]+\.[0-9]+$ ]]; then
            echo "PASS: tag format valid: $TAG"
          else
            echo "FAIL: tag '$TAG' does not match ^spec-v[0-9]+\.[0-9]+$"
            exit 1
          fi
